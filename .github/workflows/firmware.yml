name: Firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: make setup
      - run: make && make test
      - run: make emulator-check
      - name: Package artifacts
        run: |
          git rev-parse HEAD > build/SOURCE_COMMIT
          .tools/riscv32-esp-elf/bin/riscv32-esp-elf-gcc --version > build/TOOLCHAIN.txt
          cd build
          sha256sum clock.bin clock.elf clock.map SOURCE_COMMIT TOOLCHAIN.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/clock.bin
            build/clock.elf
            build/clock.map
            build/SOURCE_COMMIT
            build/TOOLCHAIN.txt
            build/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --title "$RELEASE_TAG" --notes 'Bare-metal firmware for Waveshare ESP32-C6-AMOLED-2.16. Host tests pass; see repository documentation for hardware validation limits.'
